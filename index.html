<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Input Data Kedai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .tab-active { border-bottom: 2px solid #3b82f6; color: #1d4ed8; font-weight: 600; }
        .tab-inactive { color: #6b7280; font-weight: 500; }
        .tab-inactive:hover { color: #374151; }
        /* Transisi smooth untuk tab content */
        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex items-start justify-center">

    <div class="w-full max-w-3xl bg-white rounded-2xl shadow-xl overflow-hidden">
        
        <!-- Header -->
        <div class="bg-blue-600 p-6 text-white text-center">
            <h1 class="text-2xl font-bold">Portal Data Kedai</h1>
            <p class="text-blue-100 text-sm mt-1">Sistem Input Harian & Logistik</p>
        </div>

        <!-- Tabs -->
        <div class="flex border-b border-gray-200">
            <button onclick="switchTab('penjualan')" id="tab-penjualan" class="flex-1 py-4 text-center tab-active transition">Penjualan Harian</button>
            <button onclick="switchTab('pengiriman')" id="tab-pengiriman" class="flex-1 py-4 text-center tab-inactive transition">Pengiriman</button>
            <button onclick="switchTab('pembelian')" id="tab-pembelian" class="flex-1 py-4 text-center tab-inactive transition">Pembelian</button>
        </div>

        <div class="p-6 md:p-8">
            
            <!-- TAB 1: PENJUALAN HARIAN -->
            <form id="form-penjualan" class="tab-content active" onsubmit="submitData(event, 'penjualan')">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal</label>
                        <input type="date" name="tanggal" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Kedai</label>
                        <input type="text" name="kedai" placeholder="Nama Kedai" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>

                <div class="bg-blue-50 p-4 rounded-xl mb-6">
                    <h3 class="font-semibold text-blue-800 mb-4 border-b border-blue-200 pb-2">Keuangan</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Total Penjualan</label>
                            <input type="number" name="total_penjualan" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">QR</label>
                            <input type="number" name="qr" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Cash</label>
                            <input type="number" name="cash" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Gas</label>
                            <input type="number" name="gas" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Bensin</label>
                            <input type="number" name="bensin" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Lain-Lain</label>
                            <input type="number" name="lain_lain" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                    </div>
                </div>

                <div class="bg-gray-50 p-4 rounded-xl mb-6">
                    <h3 class="font-semibold text-gray-800 mb-4 border-b border-gray-200 pb-2">Stok Barang</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Stok Awal</label>
                            <input type="number" name="stok" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Terjual</label>
                            <input type="number" name="jual" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Sisa</label>
                            <input type="number" name="sisa" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 flex justify-center items-center">
                    <span class="btn-text">Kirim Data Penjualan</span>
                    <svg class="animate-spin hidden ml-2 h-5 w-5 text-white loading-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                </button>
            </form>

            <!-- TAB 2: PENGIRIMAN BARANG -->
            <form id="form-pengiriman" class="tab-content" onsubmit="submitData(event, 'pengiriman')">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal</label>
                        <input type="date" name="tanggal" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Kedai Tujuan</label>
                        <input type="text" name="kedai" placeholder="Nama Kedai" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>

                <div class="mb-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-semibold text-gray-800">Daftar Barang</h3>
                        <button type="button" onclick="addRow('pengiriman')" class="text-sm bg-green-100 text-green-700 px-3 py-1.5 rounded-md hover:bg-green-200 transition font-medium">
                            + Tambah Barang
                        </button>
                    </div>
                    
                    <div id="container-pengiriman" class="space-y-3">
                        <!-- Row Template -->
                        <div class="flex gap-2 items-start item-row">
                            <div class="flex-1">
                                <input type="text" name="nama_barang[]" placeholder="Nama Barang" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            </div>
                            <div class="w-24">
                                <input type="number" name="qty[]" placeholder="Qty" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            </div>
                            <button type="button" onclick="removeRow(this)" class="p-2.5 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition" title="Hapus baris">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 flex justify-center items-center">
                    <span class="btn-text">Kirim Data Pengiriman</span>
                    <svg class="animate-spin hidden ml-2 h-5 w-5 text-white loading-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                </button>
            </form>

            <!-- TAB 3: PEMBELIAN BARANG -->
            <form id="form-pembelian" class="tab-content" onsubmit="submitData(event, 'pembelian')">
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Pembelian</label>
                    <input type="date" name="tanggal" required class="w-full md:w-1/2 border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div class="mb-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-semibold text-gray-800">Daftar Belanja</h3>
                        <button type="button" onclick="addRow('pembelian')" class="text-sm bg-green-100 text-green-700 px-3 py-1.5 rounded-md hover:bg-green-200 transition font-medium">
                            + Tambah Barang
                        </button>
                    </div>
                    
                    <div id="container-pembelian" class="space-y-3">
                        <!-- Row Template -->
                        <div class="flex flex-wrap md:flex-nowrap gap-2 items-start item-row">
                            <div class="flex-1 min-w-[150px]">
                                <input type="text" name="nama_barang[]" placeholder="Nama Barang" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            </div>
                            <div class="w-24 flex-shrink-0">
                                <input type="number" name="qty[]" placeholder="Qty" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            </div>
                            <div class="flex-1 min-w-[120px]">
                                <input type="number" name="harga[]" placeholder="Harga Satuan (Rp)" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            </div>
                            <button type="button" onclick="removeRow(this)" class="p-2.5 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition" title="Hapus baris">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 flex justify-center items-center">
                    <span class="btn-text">Kirim Data Pembelian</span>
                    <svg class="animate-spin hidden ml-2 h-5 w-5 text-white loading-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                </button>
            </form>

        </div>
    </div>

    <!-- Custom Modal Component (Pengganti Alert) -->
    <div id="custom-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-sm w-full p-6 text-center transform scale-95 transition-transform duration-300">
            <div id="modal-icon" class="mx-auto flex items-center justify-center h-12 w-12 rounded-full mb-4">
                <!-- Icon will be injected here -->
            </div>
            <h3 id="modal-title" class="text-lg leading-6 font-bold text-gray-900 mb-2">Pesan</h3>
            <p id="modal-message" class="text-sm text-gray-500 mb-6">Deskripsi pesan.</p>
            <button onclick="closeModal()" class="w-full inline-flex justify-center rounded-lg border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none sm:text-sm">
                Tutup
            </button>
        </div>
    </div>

    <script>
        // GANTI URL DI BAWAH INI DENGAN URL DEPLOYMENT GOOGLE APPS SCRIPT ANDA
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwYOUR_SCRIPT_ID_HERE/exec'; 

        /* Mengelola Perpindahan Tab */
        function switchTab(tabId) {
            // Sembunyikan semua konten
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            // Reset gaya semua tab
            document.querySelectorAll('[id^="tab-"]').forEach(el => {
                el.classList.remove('tab-active');
                el.classList.add('tab-inactive');
            });

            // Tampilkan konten yang dipilih
            document.getElementById(`form-${tabId}`).classList.add('active');
            // Aktifkan gaya tab yang dipilih
            const activeTab = document.getElementById(`tab-${tabId}`);
            activeTab.classList.remove('tab-inactive');
            activeTab.classList.add('tab-active');
        }

        /* Mengelola Penambahan Baris Input Dinamis */
        function addRow(type) {
            const container = document.getElementById(`container-${type}`);
            const rowDiv = document.createElement('div');
            
            if(type === 'pengiriman') {
                rowDiv.className = 'flex gap-2 items-start item-row mt-3';
                rowDiv.innerHTML = `
                    <div class="flex-1">
                        <input type="text" name="nama_barang[]" placeholder="Nama Barang" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div class="w-24">
                        <input type="number" name="qty[]" placeholder="Qty" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <button type="button" onclick="removeRow(this)" class="p-2.5 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition" title="Hapus baris">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                `;
            } else if (type === 'pembelian') {
                rowDiv.className = 'flex flex-wrap md:flex-nowrap gap-2 items-start item-row mt-3';
                rowDiv.innerHTML = `
                    <div class="flex-1 min-w-[150px]">
                        <input type="text" name="nama_barang[]" placeholder="Nama Barang" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div class="w-24 flex-shrink-0">
                        <input type="number" name="qty[]" placeholder="Qty" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div class="flex-1 min-w-[120px]">
                        <input type="number" name="harga[]" placeholder="Harga Satuan (Rp)" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <button type="button" onclick="removeRow(this)" class="p-2.5 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition" title="Hapus baris">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                `;
            }
            container.appendChild(rowDiv);
        }

        /* Menghapus Baris Input */
        function removeRow(btn) {
            const row = btn.closest('.item-row');
            // Pastikan setidaknya ada 1 baris yang tersisa
            if(row.parentElement.children.length > 1) {
                row.remove();
            } else {
                showModal('Peringatan', 'Minimal harus ada 1 barang.', 'warning');
            }
        }

        /* Mengelola Tampilan Modal Kustom */
        function showModal(title, message, type = 'success') {
            const modal = document.getElementById('custom-modal');
            const modalContent = modal.querySelector('div');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            
            const iconContainer = document.getElementById('modal-icon');
            if(type === 'success') {
                iconContainer.className = 'mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-green-100 text-green-600 mb-4';
                iconContainer.innerHTML = '<svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
            } else if (type === 'error' || type === 'warning') {
                iconContainer.className = 'mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100 text-red-600 mb-4';
                iconContainer.innerHTML = '<svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>';
            }

            modal.classList.remove('hidden');
            // Sedikit delay untuk efek pop-up
            setTimeout(() => {
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            const modalContent = modal.querySelector('div');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        /* Mengelola Submit Data ke Google Apps Script */
        async function submitData(event, type) {
            event.preventDefault();
            const form = event.target;
            const submitBtn = form.querySelector('button[type="submit"]');
            const btnText = submitBtn.querySelector('.btn-text');
            const loadingIcon = submitBtn.querySelector('.loading-icon');

            // Status loading
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
            btnText.textContent = 'Mengirim...';
            loadingIcon.classList.remove('hidden');

            try {
                // Ekstrak data form
                const formData = new FormData(form);
                let payload = { type: type, data: {} };

                if (type === 'penjualan') {
                    formData.forEach((value, key) => payload.data[key] = value);
                } else {
                    // Untuk pengiriman dan pembelian (data array/list)
                    payload.data.tanggal = formData.get('tanggal');
                    if(formData.get('kedai')) payload.data.kedai = formData.get('kedai');
                    
                    payload.data.items = [];
                    const names = formData.getAll('nama_barang[]');
                    const qtys = formData.getAll('qty[]');
                    const hargas = formData.getAll('harga[]'); // mungkin kosong untuk pengiriman

                    for (let i = 0; i < names.length; i++) {
                        let item = { nama: names[i], qty: qtys[i] };
                        if (hargas.length > 0) item.harga = hargas[i];
                        payload.data.items.push(item);
                    }
                }

                // Pengiriman data menggunakan fetch api
                // Catatan: Menggunakan mode 'no-cors' agar tidak diblokir oleh preflight CORS dari Google
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Penting untuk komunikasi form statis ke GAS
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // Reset Form
                form.reset();
                showModal('Berhasil!', `Data ${type.charAt(0).toUpperCase() + type.slice(1)} berhasil dikirim ke Spreadsheet.`, 'success');

            } catch (error) {
                console.error('Error!', error.message);
                showModal('Gagal!', 'Terjadi kesalahan saat mengirim data. Pastikan URL Apps Script sudah benar.', 'error');
            } finally {
                // Kembalikan tombol ke kondisi semula
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                btnText.textContent = `Kirim Data ${type.charAt(0).toUpperCase() + type.slice(1)}`;
                loadingIcon.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
